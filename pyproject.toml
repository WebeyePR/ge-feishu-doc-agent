[project]
name = "adk-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==1.24.1",
    "google-cloud-aiplatform>=1.135.0",
    "requests>=2.31.0",
    "python-dotenv>=1.2.1",
    "Pillow>=10.0.0",
    "langchain_google_vertexai>=3.2.2",
    "langgraph>=1.0.7",
    "google-genai>=1.56.0",
    "markdown>=3.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lark_agent*"]

[tool.setuptools.package-data]
# 声明打包包含的非 py 资源文件，确保部署及发布后的 wheel 包中包含必要的执行器与命令注册表。
# 早期关于上传超时的疑虑已在最新的 deploy 脚本超时机制中完美解决，此处需完整打包以保证自省功能高可用。
lark_agent = [
    "bin/lark-cli",
    "bin/gws",
    "gws_registry/commands.json",
    "lark_registry/commands.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

